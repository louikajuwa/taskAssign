services:
  app:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: taskassign_app
    restart: unless-stopped
    working_dir: /var/www
    # php-fpm workers run as www-data. Make sure storage/cache are owned by it (queue/scheduler run as root
    # and may create root-owned files in the shared bind mount; they are chowned back on every app start).
    command: sh -c "chown -R www-data:www-data storage bootstrap/cache && chmod -R ug+rwX storage bootstrap/cache && php-fpm"
    volumes:
      - ./:/var/www
      - ./storage/app/public:/var/www/storage/app/public
    networks:
      - taskassign
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: nginx:alpine
    container_name: taskassign_web
    restart: unless-stopped
    ports:
      - "8087:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - taskassign
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/login >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: taskassign_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-taskassign}
      # Falls back to DB_PASSWORD (previous behaviour). Set DB_ROOT_PASSWORD in .env for a distinct root password;
      # it only takes effect on a fresh data volume (an existing volume keeps its current root password).
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-${DB_PASSWORD:-secret}}
      MYSQL_USER: ${DB_USERNAME:-taskassign}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
    volumes:
      - dbdata:/var/lib/mysql
    ports:
      - "127.0.0.1:3387:3306"
    networks:
      - taskassign
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: taskassign_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6387:6379"
    networks:
      - taskassign
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  queue:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: taskassign_queue
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan queue:work redis --sleep=3 --tries=3 --backoff=10
    volumes:
      - ./:/var/www
    networks:
      - taskassign
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

  # Runs the Laravel scheduler (cron). Currently its only job is the daily
  # cleanup of email logs older than 30 days (see routes/console.php).
  scheduler:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: taskassign_scheduler
    restart: unless-stopped
    working_dir: /var/www
    command: php artisan schedule:work
    volumes:
      - ./:/var/www
    networks:
      - taskassign
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_healthy

  # Web UI for browsing the database in your browser (http://localhost:8088, host-only).
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: taskassign_phpmyadmin
    restart: unless-stopped
    ports:
      - "127.0.0.1:8088:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    networks:
      - taskassign
    depends_on:
      db:
        condition: service_healthy

networks:
  taskassign:
    driver: bridge

volumes:
  dbdata:
    driver: local
